name: Build SatAPRS-Go

on:
  push:
    branches: ["main", "master"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: go.mod
      - name: Resolve Go modules
        run: go mod tidy
      - name: Test protocol core and PTT helpers
        run: go test ./internal/aprs ./internal/rigctl ./internal/pttctl ./internal/audio

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: go.mod
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Resolve Go modules
        run: go mod tidy
      - name: Test app configuration, protocol, PTT and audio modules
        run: go test . ./internal/aprs ./internal/rigctl ./internal/pttctl ./internal/audio
      - name: Build Windows AMD64 application
        run: wails build -platform windows/amd64 -o SatAPRS-Go.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SatAPRS-Go-windows-amd64
          path: build/bin/SatAPRS-Go.exe
          if-no-files-found: error
